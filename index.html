<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BOS Quiz</title>
  <link rel="icon" href="assets/avatars/chef.webp">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/admin.css">
  <script src="lib/supabase.js"></script>
  <script type="importmap">{ "imports": { "three": "./lib/three/three.module.js", "three/addons/": "./lib/three/addons/" } }</script>
</head>
<body class="adm">
  <!-- ============ LIBRARY ============ -->
  <section id="v-lib" class="hidden">
    <header class="adm-top">
      <a class="brand" href="#"><img src="assets/avatars/chef.webp" alt=""><span>BOS Quiz</span></a>
      <div class="sp"></div>
      <button class="btn" id="btn-new">＋ Create quiz</button>
      <button class="link" id="btn-logout" title="Log out of admin">Log out</button>
    </header>
    <main class="lib">
      <div class="lib-head">
        <div><h1>My quizzes</h1><p class="muted" id="lib-count">Loading…</p></div>
        <input id="lib-search" type="search" placeholder="Search quizzes…" autocomplete="off">
      </div>
      <div class="lib-msg hidden" id="lib-msg"></div>
      <div class="lib-grid" id="lib-grid"></div>
    </main>
  </section>

  <!-- ============ STUDIO (create / edit one quiz) ============ -->
  <section id="v-studio" class="hidden">
    <header class="adm-top studio-top">
      <button class="back" id="st-back" title="Back to my quizzes">← <span>My quizzes</span></button>
      <input class="st-name" id="st-name" maxlength="80" placeholder="Quiz title" autocomplete="off">
      <nav class="st-tabs">
        <button data-tab="theme" class="on">🎨 Theme</button>
        <button data-tab="questions">❓ Questions <b id="st-qcount">0</b></button>
      </nav>
      <div class="sp"></div>
      <span class="st-status" id="st-status"></span>
      <button class="btn ghost" id="st-save">💾 Save</button>
      <button class="btn" id="st-play">▶ Play</button>
    </header>

    <div class="st-pane" id="pane-theme">
      <div class="tp-stage" id="tp-stage">
        <div class="tp-canvas" id="tp-canvas"></div>
        <div class="tp-title" id="tp-title"><b id="tp-t">BOS Quiz</b><small id="tp-s"></small></div>
        <button class="tp-arrow prev" id="tp-prev" aria-label="Previous theme">‹</button>
        <button class="tp-arrow next" id="tp-next" aria-label="Next theme">›</button>
        <div class="tp-loading hidden" id="tp-loading"><span class="spin"></span> Loading 3D…</div>
        <div class="tp-dots" id="tp-dots"></div>
        <div class="tp-hint">Swipe or use ‹ › to browse themes</div>
      </div>
      <aside class="tp-side">
        <div class="tp-card">
          <div class="tp-tname"><span id="tp-name">Classic</span><em class="tp-sel">✓ Selected</em></div>
          <p class="muted" id="tp-blurb"></p>
          <label class="tp-field">Title on the big screen<input id="tp-in-title" maxlength="80" autocomplete="off"></label>
          <label class="tp-field">Subtitle<input id="tp-in-sub" maxlength="80" autocomplete="off"></label>
          <div class="tp-label">Colour palette</div>
          <div class="tp-pals" id="tp-pals"></div>
          <div class="tp-label">Fonts</div>
          <div class="tp-fonts" id="tp-fonts"></div>
          <div class="tp-label">Right / wrong animation</div>
          <div class="tp-fx" id="tp-fx"></div>
          <button class="btn tp-next" id="tp-go">Next: questions →</button>
        </div>
      </aside>
    </div>

    <div class="st-pane hidden" id="pane-questions">
      <div class="qwrap"><div id="ed-root"></div></div>
    </div>
  </section>

  <div class="adm-loading" id="adm-loading"><span class="spin"></span></div>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
